inicio.titulo=Centro de actividades de Sevilla
inicio.intro=Un centro público que organiza actividades por Sevilla para todas las edades.

# ===== Actividades (un bloque por identificador del array del controlador) =====
actividad.taller.titulo=Taller de cerámica para familias
actividad.taller.descripcion=Una tarde para modelar piezas de barro en familia, con ayuda de un ceramista. No hace falta experiencia previa.
actividad.taller.fecha=Sábado 14 de noviembre · 2 horas
actividad.taller.lugar=Sala de talleres, planta baja

actividad.concierto.titulo=Concierto de guitarra flamenca
actividad.concierto.descripcion=Un recital íntimo de guitarra flamenca con repertorio clásico y composiciones propias del intérprete.
actividad.concierto.fecha=Viernes 20 de noviembre · 1 hora y 30 minutos
actividad.concierto.lugar=Auditorio del centro

actividad.ruta.titulo=Ruta guiada por el casco histórico
actividad.ruta.descripcion=Un paseo a pie por rincones, plazas y edificios con historia, contado por una guía local.
actividad.ruta.fecha=Domingo 22 de noviembre · 2 horas
actividad.ruta.lugar=Salida desde la puerta principal del centro

# ===== Página de visita =====
visita.titulo.pagina=Tu visita
visita.titulo=Prepara tu visita
visita.intro=Todo lo que necesitas saber para disfrutar del centro sin sorpresas.
visita.horario.titulo=Horario
visita.horario.texto=De martes a sábado, de 10:00 a 20:00. Domingos de 10:00 a 14:00. Los lunes permanece cerrado.
visita.llegar.titulo=Cómo llegar
visita.llegar.texto=El centro está en el casco histórico de Sevilla, a pocos minutos a pie de las paradas de autobús y tranvía. Se recomienda ir andando o en bicicleta.
visita.acceso.titulo=Accesibilidad
visita.acceso.texto=Todas las salas son accesibles con silla de ruedas. Hay bucle magnético en el auditorio y personal de apoyo disponible previa solicitud.
visita.entradas.titulo=Entradas
visita.entradas.texto=La entrada al centro es gratuita. Los talleres y conciertos requieren reserva previa, que se puede hacer en recepción.