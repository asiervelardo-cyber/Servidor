spring.application.name=U4-Ejercicio_P3

# Conexión a MariaDB (XAMPP). Usuario y contraseña se pueden cambiar con
# las variables de entorno DB_USERNAME y DB_PASSWORD; por defecto root sin contraseña.
spring.datasource.url=jdbc:mariadb://localhost:3306/recomendar_canciones
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# update crea o amplía la tabla sin borrar los datos al reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
