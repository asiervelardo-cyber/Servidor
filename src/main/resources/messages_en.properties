# ===== Activities (one block per identifier in the controller array) =====
actividad.taller.titulo=Family pottery workshop
actividad.taller.descripcion=An afternoon of shaping clay pieces as a family, with the help of a ceramicist. No previous experience needed.
actividad.taller.fecha=Saturday 14 November · 2 hours
actividad.taller.lugar=Workshop room, ground floor

actividad.concierto.titulo=Flamenco guitar concert
actividad.concierto.descripcion=An intimate flamenco guitar recital with classic repertoire and the performer's own compositions.
actividad.concierto.fecha=Friday 20 November · 1 hour 30 minutes
actividad.concierto.lugar=Centre auditorium

actividad.ruta.titulo=Guided tour of the old town
actividad.ruta.descripcion=A walk through corners, squares and buildings full of history, led by a local guide.
actividad.ruta.fecha=Sunday 22 November · 2 hours
actividad.ruta.lugar=Departs from the main entrance of the centre

# ===== Visit page =====
visita.titulo.pagina=Your visit
visita.titulo=Prepare your visit
visita.intro=Everything you need to know to enjoy the centre without surprises.
visita.horario.titulo=Opening hours
visita.horario.texto=Tuesday to Saturday, 10:00 to 20:00. Sundays 10:00 to 14:00. Closed on Mondays.
visita.llegar.titulo=Getting here
visita.llegar.texto=The centre is in the historic quarter of Seville, a few minutes on foot from the bus and tram stops. Walking or cycling is recommended.
visita.acceso.titulo=Accessibility
visita.acceso.texto=All rooms are wheelchair accessible. The auditorium has a hearing loop and support staff are available on request.
visita.entradas.titulo=Tickets
visita.entradas.texto=Entry to the centre is free. Workshops and concerts require advance booking, which can be done at reception.